# Free the seat's input-method-v2 slot for wvkbd (on-screen keyboard).
# fcitx5's waylandim frontend grabs the slot exclusively, which blocks every
# Wayland OSK. fcitx5 stays running for XCompose in XWayland clients.
# Revert: delete this file, daemon-reload, restart omarchy-fcitx5.
[Service]
ExecStart=
ExecStart=/usr/bin/fcitx5 --disable notificationitem,waylandim
